name: Bug Detection CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  bug-detection:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Bug Detection
        id: bug-scan
        run: |
          npm run bug-check > bug-report.txt 2>&1
          echo "::set-output name=report::$(cat bug-report.txt)"

      - name: Parse Bug Report
        id: parse
        run: |
          CRITICAL=$(grep -c "CRITICAL" bug-report.txt || echo "0")
          HIGH=$(grep -c "HIGH" bug-report.txt || echo "0")
          MEDIUM=$(grep -c "MEDIUM" bug-report.txt || echo "0")
          LOW=$(grep -c "LOW" bug-report.txt || echo "0")

          echo "::set-output name=critical::$CRITICAL"
          echo "::set-output name=high::$HIGH"
          echo "::set-output name=medium::$MEDIUM"
          echo "::set-output name=low::$LOW"

      - name: Comment PR with Bug Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('bug-report.txt', 'utf8');

            const critical = '${{ steps.parse.outputs.critical }}';
            const high = '${{ steps.parse.outputs.high }}';
            const medium = '${{ steps.parse.outputs.medium }}';
            const low = '${{ steps.parse.outputs.low }}';

            const comment = `## 🐛 Bug Detection Report

            ### Summary
            - 🔴 Critical: ${critical}
            - 🟠 High: ${high}
            - 🟡 Medium: ${medium}
            - 🔵 Low: ${low}

            ### Details
            \`\`\`
            ${report.substring(0, 1000)}
            \`\`\`

            ${critical > 0 ? '⚠️ **Critical bugs detected! Please fix before merging.**' : '✅ No critical bugs detected.'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if Critical Bugs
        if: steps.parse.outputs.critical > 0
        run: |
          echo "❌ Critical bugs detected. Build failed."
          exit 1

      - name: Upload Bug Report
        uses: actions/upload-artifact@v3
        with:
          name: bug-report
          path: bug-report.txt

  auto-fix:
    runs-on: ubuntu-latest
    needs: bug-detection
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run Auto-Fix
        run: |
          echo "Running automated bug fixes..."
          npm run bug-fix || true

      - name: Check for Changes
        id: check-changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::set-output name=changes::true"
          else
            echo "::set-output name=changes::false"
          fi

      - name: Create Fix PR
        if: steps.check-changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: '🐛 Auto-fix bugs detected by CI'
          title: '[Auto] Fix bugs detected in PR #${{ github.event.pull_request.number }}'
          body: |
            ## 🤖 Automated Bug Fixes

            This PR contains automated fixes for bugs detected in PR #${{ github.event.pull_request.number }}.

            ### Fixed Issues:
            - Safe localStorage parsing
            - Added error handling
            - Fixed React warnings

            Please review the changes before merging.
          branch: auto-fix-${{ github.event.pull_request.number }}
          delete-branch: true